[project]
name = "build-python"
version = "0.1.0"
description = "A simple multi-agent demo for a mobile network call center: a reception agent routes callers to specialist agents."
readme = "README.md"
authors = [
    { name = "yashveernegi", email = "yashveer2negi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
build-python = "build_python.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
